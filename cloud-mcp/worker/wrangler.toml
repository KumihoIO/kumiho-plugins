name = "kumiho-mcp-edge"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["allow_custom_ports"]

# Wrangler provisions DNS and TLS for this dedicated Worker hostname.
routes = [
  { pattern = "mcp.kumiho.cloud", custom_domain = true }
]

[vars]
ENVIRONMENT = "production"
# Public domain verification value for the Kumiho Memory directory submission.
OPENAI_APPS_CHALLENGE = "XxpHh5BkHzPJot3Rr11gU3F5l5CsGtwP2r0iiytFMvk"
# Verified on 2026-09-16 against ECS revision 21 and the NLB TLS:8443 listener.
# /healthz reaches the origin; /edge-health checks only the Worker.
ORIGIN_URL = "https://ap-northeast-2.kumiho.cloud:8443"
# Requests per window per client IP. MCP is chatty (one HTTP request per
# JSON-RPC call in stateless mode), so this is deliberately generous.
RATE_LIMIT_REQUESTS = "600"
RATE_LIMIT_WINDOW_MS = "60000"

[env.staging]
name = "kumiho-mcp-edge-staging"
vars = { ENVIRONMENT = "staging", ORIGIN_URL = "http://localhost:8080", RATE_LIMIT_REQUESTS = "600", RATE_LIMIT_WINDOW_MS = "60000" }

[env.dev]
name = "kumiho-mcp-edge-dev"
vars = { ENVIRONMENT = "development", ORIGIN_URL = "http://localhost:8080", RATE_LIMIT_REQUESTS = "6000", RATE_LIMIT_WINDOW_MS = "60000" }

[observability]
enabled = true
