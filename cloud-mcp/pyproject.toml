[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kumiho-cloud-mcp"
version = "0.1.0"
description = "Hosted MCP resource server for Kumiho Memory (mcp.kumiho.cloud)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kumiho", email = "support@kumiho.io" }]
keywords = ["mcp", "kumiho", "memory", "claude", "connector"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
]

dependencies = [
    # 0.13.0 is the first release with create_mcp_server(profile=...),
    # TOOL_ANNOTATIONS and kumiho.request_context (plan SS2.1-2.2).
    # 0.13.1 implements retrieve mode "latest" (newest first by last update,
    # with or without a query), which the hosted retrieve description states.
    # 0.13.2 takes item_kref on the store so a correction revises the memory it
    # names instead of a similarity guess, and stops space_paths matching a
    # same-prefixed space by name.
    # 0.14.0 adds Evaluate with transport retry handling for paid requests.
    "kumiho[mcp]>=0.14.0",
    # 1.4.0 is the first release with hosted mode: the per-tenant manager
    # cache, contextvar session resolution and the control-plane Redis proxy
    # (plan SS2.3). 1.3.0 has the 18-tool surface but builds ONE process-wide
    # manager from the ambient environment, so every tenant would share it.
    # app.py refuses to start on anything older outside dev mode.
    # 1.5.1 gives reflect a capture-level "revises" field that passes the named
    # memory through to the SDK store's item_kref, which the hosted reflect
    # description tells the model to use for a correction.
    # 1.6.0 provides the per-request judged-delivery context override.
    # 1.6.1 forwards evaluation usage and cache diagnostics in engage.
    "kumiho-memory[all]>=1.6.1",
    "mcp>=2.2.0,<3",
    "starlette>=0.37,<1.0",
    "uvicorn[standard]>=0.30",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.27",
    "anyio>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
kumiho-cloud-mcp = "kumiho_cloud_mcp.app:main"

[project.urls]
Homepage = "https://kumiho.io"
Documentation = "https://kumiho.io/docs/connect/claude"
Source = "https://github.com/KumihoIO/kumiho-plugins"

[tool.setuptools.packages.find]
include = ["kumiho_cloud_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# UP is off on purpose: typing.Optional/Dict read the same in every file here
# and the churn of rewriting them buys nothing at a 3.11 floor.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
