# Plugins CI
#
# This repo shipped for a long time with no CI at all: its ~143 Python tests
# and ~193 openclaw tests only ran when someone remembered to. A plugin release
# is what reaches users' machines and provisions their venvs, so a regression
# here is not caught by anything downstream.
#
# Deliberately NOT covered, so the gaps are stated rather than implied:
#   * comfyui/tests — imports torch via kumiho_nodes, i.e. the whole ComfyUI
#     runtime. Running it needs a ComfyUI install, not a pip line.
#   * openclaw `npm run lint` — eslint 9 requires a flat eslint.config.js and
#     this package has none, so the script exits 2 on a config error before it
#     lints anything. Add the config and this becomes a job.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # The launcher runs on whatever interpreter the user's machine provides,
    # so both ends of the supported range are exercised rather than just the
    # runner default.
    name: Python ${{ matrix.python }} (launcher + provisioning)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test deps
        # The suites under test are pure stdlib plus pytest by design — they
        # stub the venv and the network rather than provisioning either.
        run: python -m pip install --upgrade pip pytest
      - name: Test
        run: python -m pytest claude/scripts codex/scripts -q

  openclaw:
    name: openclaw (vitest / typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openclaw
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'          # package.json engines: node >=20
          cache: npm
          cache-dependency-path: openclaw/package-lock.json
      - name: Install
        # --legacy-peer-deps on purpose: `openclaw` is a PEER dependency, the
        # host application this plugin loads into. npm 7+ would install it, but
        # the lockfile has no resolved entry for it, so a plain `npm ci` fails
        # with EUSAGE. A plugin should not vendor its host to run unit tests,
        # and typecheck passes without it.
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Test
        run: npx vitest run
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        # dist/ is what actually ships to npm, so a broken build is a broken
        # release even when every test passes.
        run: npx tsup src/index.ts src/host-auth.ts src/setup-support.ts --format esm --dts --out-dir dist

  manifests:
    name: Manifests (JSON valid / versions agree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The version checks compare this tree against the commit it branched
          # from, so the base commit has to actually be in the clone.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate
        # The plugin version is written in five separate files -- claude/README.md
        # is the fifth, and was outside this check until #70 -- and the release
        # spec in five more. Nothing but care kept them in step, and care is
        # exactly what fails during a hurried release.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess, sys

          failures = []


          def load(path):
              try:
                  return json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
                  return None


          # Every manifest must parse.
          manifests = sorted(
              set(str(p) for p in pathlib.Path(".").glob("**/*.plugin.json"))
              | set(str(p) for p in pathlib.Path(".").glob("**/marketplace.json"))
              | set(str(p) for p in pathlib.Path(".").glob("**/.mcp.json"))
          )
          manifests = [m for m in manifests if "node_modules" not in m]
          for m in manifests:
              load(m)
          print(f"parsed {len(manifests)} manifest(s)")

          # --- the kumiho-memory plugin version, on every surface that states it ------
          #
          # A surface missing from this list is a surface a hurried release forgets:
          # claude/README.md carried the version by hand for four releases with nothing
          # checking it.  Absence is an error, not agreement -- a marketplace entry that
          # loses its `version` key used to shrink the comparison set to one and pass.
          SEMVER = re.compile(r"^\d+\.\d+\.\d+([-+][0-9A-Za-z.+-]+)?$")
          README_VERSION = re.compile(r"^Version: \*\*([^*]+)\*\*", re.MULTILINE)


          def _entry_version(text, path):
              data = json.loads(text)
              for entry in data.get("plugins", []):
                  if entry.get("name") == "kumiho-memory":
                      return entry.get("version")
              raise KeyError(f"no kumiho-memory entry in {path}")


          def _manifest_version(text, path):
              return json.loads(text).get("version")


          def _readme_version(text, path):
              m = README_VERSION.search(text)
              if not m:
                  raise KeyError(f"no 'Version: **x.y.z**' line in {path}")
              return m.group(1).strip()


          VERSION_SURFACES = {
              "claude/.claude-plugin/plugin.json": _manifest_version,
              "codex/.codex-plugin/plugin.json": _manifest_version,
              ".claude-plugin/marketplace.json": _entry_version,
              ".codex-plugin/marketplace.json": _entry_version,
              "claude/README.md": _readme_version,
          }


          def collect_versions(read, sink):
              """version-by-surface for one tree. `read(path)` returns text or None."""
              versions = {}
              for path, pick in VERSION_SURFACES.items():
                  text = read(path)
                  if text is None:
                      sink.append(f"{path}: version surface is missing")
                      continue
                  try:
                      value = pick(text, path)
                  except Exception as exc:
                      sink.append(f"{path}: cannot read the plugin version ({exc})")
                      continue
                  if not value:
                      sink.append(f"{path}: has no version (absence is not agreement)")
                      continue
                  if not SEMVER.match(str(value)):
                      sink.append(f"{path}: version {value!r} is not semver")
                      continue
                  versions[path] = str(value)
              return versions


          def read_worktree(path):
              p = pathlib.Path(path)
              return p.read_text(encoding="utf-8") if p.exists() else None


          versions = collect_versions(read_worktree, failures)
          distinct = set(versions.values())
          current = next(iter(distinct)) if len(distinct) == 1 else None
          if len(distinct) > 1:
              failures.append(f"plugin version disagrees across files: {versions}")
          elif len(versions) < len(VERSION_SURFACES):
              print(f"plugin version readable on only {len(versions)}/{len(VERSION_SURFACES)} surface(s)")
          else:
              print(f"plugin version {current} consistent across all "
                    f"{len(versions)} surface(s)")

          # --- did a bump actually happen? -------------------------------------------
          #
          # Self-consistency alone is blind to history: leaving every surface on the
          # previous number passes green.  Two anchors close that, both fail-open when
          # the base commit is not fetched so this never goes red for the wrong reason.
          #
          #   * monotonic -- the version must never go backwards.
          #   * declared  -- this repo names the release in the commit subject
          #     ("fix(claude): ..., 0.20.1").  When a commit in this push/PR declares a
          #     version, the surfaces must actually be at it.  That is the case the
          #     old check could not see: a release commit whose files were never edited.
          base = (os.getenv("BASE_SHA") or "").strip()


          def git(*args):
              # Explicit utf-8: git blobs and commit subjects here contain em dashes, and
              # decoding them with the ambient locale codec fails on some runners.
              return subprocess.run(("git",) + args, capture_output=True, text=True,
                                    encoding="utf-8", errors="replace")


          def base_usable():
              if not base or set(base) == {"0"}:
                  return False
              return git("cat-file", "-e", base + "^{commit}").returncode == 0


          def key(v):
              return tuple(int(x) for x in v.split("-")[0].split("+")[0].split("."))


          if not base_usable():
              print("no usable base commit (BASE_SHA unset or unfetched); "
                    "skipping the bump checks")
          elif current is None:
              print("version not resolvable; skipping the bump checks")
          else:
              def read_base(path):
                  r = git("show", f"{base}:{path}")
                  return r.stdout if r.returncode == 0 else None

              base_versions = collect_versions(read_base, [])
              base_distinct = set(base_versions.values())
              previous = next(iter(base_distinct)) if len(base_distinct) == 1 else None

              if previous is None:
                  print(f"base {base[:8]} has no single version; skipping the monotonic check")
              elif key(current) < key(previous):
                  failures.append(f"plugin version went backwards: {previous} -> {current}")
              elif current == previous:
                  print(f"plugin version unchanged at {current} since {base[:8]}")
              else:
                  print(f"plugin version bumped {previous} -> {current}")

              subjects = git("log", "--format=%s", f"{base}..HEAD").stdout.splitlines()
              declared = set()
              for subject in subjects:
                  m = re.search(r",\s*(\d+\.\d+\.\d+)\s*$", subject)
                  if m:
                      declared.add(m.group(1))
              if not declared:
                  print(f"no commit declares a release version in its subject "
                        f"({len(subjects)} commit(s)); nothing to cross-check")
              elif current in declared:
                  print(f"commit subject declares {current}, and every surface is at it")
              else:
                  failures.append(
                      f"commit subject(s) declare release version {sorted(declared)} but the "
                      f"manifests are at {current} -- the bump was announced, not applied")

          # --- the provisioning spec, which decides what lands in a user's venv -------
          spec_sites = {
              "claude/.mcp.json": lambda d: d["mcpServers"]["kumiho-memory"]["env"]["KUMIHO_CLAUDE_PACKAGE_SPEC"],
              "codex/.mcp.json": lambda d: d["mcpServers"]["kumiho-memory"]["env"]["KUMIHO_CLAUDE_PACKAGE_SPEC"],
          }
          specs = {}
          for path, pick in spec_sites.items():
              data = load(path)
              if data:
                  try:
                      specs[path] = pick(data)
                  except (KeyError, TypeError) as exc:
                      failures.append(f"{path}: cannot read package spec ({exc})")
          if len(set(specs.values())) > 1:
              failures.append(f"package spec disagrees between plugins: {specs}")
          elif specs:
              print(f"package spec consistent: {next(iter(specs.values()))}")

          # The launcher default must match what the manifests declare, or a
          # host that ignores .mcp.json provisions something else entirely.
          launcher = pathlib.Path("claude/scripts/run_kumiho_mcp.py").read_text(encoding="utf-8")
          m = re.search(r'DEFAULT_PACKAGE_SPEC = "([^"]+)"', launcher)
          if not m:
              failures.append("could not find DEFAULT_PACKAGE_SPEC in the launcher")
          elif specs:
              declared_spec = next(iter(specs.values()))
              if m.group(1) not in declared_spec:
                  failures.append(
                      f"launcher DEFAULT_PACKAGE_SPEC {m.group(1)!r} is not the manifest spec {declared_spec!r}")
              else:
                  print("launcher default matches the manifest spec")

          # The discovery user-agent must stay derived from the plugin manifest. A
          # pinned copy is how it sat at 0.16.0 for five releases (#71).
          if re.search(r'DEFAULT_DISCOVERY_USER_AGENT\s*=\s*"[^"]*\d+\.\d+\.\d+', launcher):
              failures.append("the launcher pins a discovery user-agent version; derive it from the manifest")
          elif 'DISCOVERY_USER_AGENT_PRODUCT' not in launcher:
              failures.append("could not find DISCOVERY_USER_AGENT_PRODUCT in the launcher")
          else:
              claude_mcp = load("claude/.mcp.json") or {}
              ua = (claude_mcp.get("mcpServers", {}).get("kumiho-memory", {})
                    .get("env", {}).get("KUMIHO_CLAUDE_DISCOVERY_USER_AGENT", ""))
              if re.search(r"\d+\.\d+\.\d+", ua):
                  failures.append(
                      f"claude/.mcp.json pins a discovery user-agent version ({ua!r}); "
                      "leave it as a bare ${VAR} so the launcher derives it")
              else:
                  print("discovery user-agent is derived from the plugin manifest")

          # --- the kumiho / kumiho-memory floors, across every distribution channel ---
          floors = {}

          for path in ("claude/.mcp.json", "codex/.mcp.json"):
              data = load(path)
              if data:
                  try:
                      spec = data["mcpServers"]["kumiho-memory"]["env"]["KUMIHO_CLAUDE_PACKAGE_SPEC"]
                      floors[path] = dict(re.findall(r'(kumiho(?:-memory)?\[[a-z,]+\])>=([0-9][0-9a-zA-Z.]*)', spec))
                  except (KeyError, TypeError):
                      pass

          oc = load("openclaw/openclaw.plugin.json")
          if oc:
              floors["openclaw/openclaw.plugin.json"] = {
                  k: v.lstrip(">=") for k, v in (oc.get("pythonDependencies") or {}).items()
                  if k.startswith("kumiho")
              }

          gpt = pathlib.Path("gpt/pyproject.toml")
          if gpt.exists():
              floors["gpt/pyproject.toml"] = dict(
                  re.findall(r'"(kumiho(?:-memory)?\[[a-z,]+\])>=([0-9][0-9a-zA-Z.]*)"', gpt.read_text(encoding="utf-8")))

          floors = {k: v for k, v in floors.items() if v}
          distinct_floors = {tuple(sorted(v.items())) for v in floors.values()}
          if len(distinct_floors) > 1:
              failures.append(f"kumiho floors disagree across distribution channels: {floors}")
          elif floors:
              print(f"kumiho floors consistent across {len(floors)} channel(s): {dict(next(iter(floors.values())))}")

          if failures:
              print("\nFAILURES:", file=sys.stderr)
              for f in failures:
                  print(f"  - {f}", file=sys.stderr)
              sys.exit(1)
          print("\nall manifest checks passed")
          PY
