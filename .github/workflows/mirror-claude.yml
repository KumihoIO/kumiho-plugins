name: Mirror claude/ → KumihoIO/kumiho-claude

on:
  push:
    branches: [main]
    paths:
      - "claude/**"

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Subtree split and push
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          # Extract claude/ subtree into a temporary branch
          SPLIT_SHA=$(git subtree split --prefix=claude -b split-claude)

          # Push to the mirror repo
          git remote add mirror https://x-access-token:${MIRROR_TOKEN}@github.com/KumihoIO/kumiho-claude.git
          git push mirror split-claude:main --force
