# Image publication only. The existing kumiho-server service owns ECS rollout.
name: Publish Cloud MCP image for ECS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cloud-mcp/**"
      - ".github/workflows/deploy-cloud-mcp.yml"

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: kumiho-cloud-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and verify locked runtime
        working-directory: cloud-mcp
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          pip install pytest pytest-asyncio ruff
          ruff check kumiho_cloud_mcp tests scripts
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify edge worker
        working-directory: cloud-mcp/worker
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Build and test the actual production runtime
        run: |
          docker build --platform linux/amd64 -t kumiho-mcp-tested cloud-mcp
          docker run --rm --user root -v "$PWD:/workspace" -w /workspace/cloud-mcp \
            kumiho-mcp-tested sh -c 'pip install pytest pytest-asyncio && python -m pytest -q'
          docker run --rm kumiho-mcp-tested python /usr/local/bin/verify_runtime.py
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and publish immutable candidate
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # The repository must already exist; this workflow creates no infrastructure.
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null
          image="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build --platform linux/amd64 -t "$image" cloud-mcp
          docker push "$image"
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          echo "Candidate: \`$REGISTRY/$ECR_REPOSITORY@$digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Next: run kumiho-server deploy-mcp-sidecar.yml in preview mode; review the current task ARN and this digest before a separate apply. Keep evaluation disabled.' >> "$GITHUB_STEP_SUMMARY"
